<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O DOSSIÊ — Acesso</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500&display=swap');

  :root{
    --bg: #0a0a0a;
    --panel: #121212;
    --bone: #e7e4dc;
    --bone-dim: #8a877e;
    --crimson: #5c5c5c;
    --crimson-bright: #b8b8b0;
    --line: #262421;
    --focus: #d8d5cc;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{
    background:var(--bg);
    color:var(--bone);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    overflow-x:hidden;
  }

  body{
    background-image:
      radial-gradient(ellipse at top, rgba(255,255,255,0.06), transparent 60%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
  }

  .frame{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding:28px 22px 40px;
  }

  /* ---------- header stamp ---------- */
  .stamp-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.14em;
    color:var(--bone-dim);
    text-transform:uppercase;
    border-bottom:1px solid var(--line);
    padding-bottom:14px;
  }

  .stamp-row .dot{
    display:inline-block;
    width:6px; height:6px;
    border-radius:50%;
    background:var(--crimson-bright);
    margin-right:7px;
    box-shadow:0 0 6px var(--crimson-bright);
    animation:pulse 2.4s ease-in-out infinite;
  }

  @keyframes pulse{
    0%,100%{ opacity:1; }
    50%{ opacity:0.35; }
  }

  .case-no{ opacity:0.7; }

  /* ---------- hero / redaction reveal ---------- */
  .hero{
    margin-top:15vh;
    margin-bottom:8px;
  }

  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.22em;
    color:var(--crimson-bright);
    text-transform:uppercase;
    margin-bottom:18px;
  }

  .redact-line{
    display:block;
    position:relative;
    overflow:hidden;
    margin-bottom:6px;
    max-width:100%;
  }

  .redact-line span.word{
    font-family:'IBM Plex Mono', monospace;
    font-weight:700;
    font-size:clamp(30px, 9vw, 42px);
    letter-spacing:-0.01em;
    color:var(--bone);
    display:inline-block;
    line-height:1.08;
    white-space:nowrap;
  }

  .redact-line:nth-child(2) span.word{
    font-size:clamp(13px, 3.6vw, 15px);
    letter-spacing:0.02em;
    white-space:normal;
  }

  .redact-line .bar{
    position:absolute;
    inset:0;
    background:#000;
    border:1px solid #1c1c1c;
    transform-origin:left;
    animation:declass 0.9s cubic-bezier(.77,0,.18,1) forwards;
  }

  .redact-line:nth-child(1) .bar{ animation-delay:0.18s; }
  .redact-line:nth-child(2) .bar{ animation-delay:0.35s; }

  @keyframes declass{
    0%{ transform:scaleX(1); }
    60%{ transform:scaleX(1); }
    100%{ transform:scaleX(0); }
  }

  .redact-line span.word{
    opacity:0;
    animation:reveal 0.1s forwards;
  }
  .redact-line:nth-child(1) span.word{ animation-delay:0.58s; }
  .redact-line:nth-child(2) span.word{ animation-delay:0.75s; }

  @keyframes reveal{ to{ opacity:1; } }

  .subtitle{
    font-size:14.5px;
    line-height:1.6;
    color:var(--bone-dim);
    font-weight:300;
    max-width:34ch;
    margin-top:20px;
    opacity:0;
    animation:fadeUp 0.6s ease forwards;
    animation-delay:0.95s;
  }

  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(6px); }
    to{ opacity:1; transform:translateY(0); }
  }

  /* ---------- access points (links) ---------- */
  .docs{
    margin-top:15vh;
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .doc{
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    padding:16px 16px;
    background:var(--panel);
    border:1px solid var(--crimson);
    text-decoration:none;
    color:var(--bone);
    transition:border-color 0.25s ease, background 0.25s ease, transform 0.15s ease;
    opacity:0;
    animation:fadeUp 0.55s ease forwards;
    animation-delay:1.1s;
  }

  .doc:active{ transform:scale(0.985); }

  .doc:hover{
    border-color:var(--crimson-bright);
    background:#151312;
  }

  .doc:focus-visible{
    outline:2px solid var(--focus);
    outline-offset:3px;
  }

  .doc .tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    letter-spacing:0.08em;
    color:var(--crimson-bright);
    border:1px solid rgba(184,184,176,0.35);
    padding:3px 6px;
    white-space:nowrap;
  }

  .doc .label{
    flex:1;
    font-size:14.5px;
    font-weight:500;
  }

  .doc .label small{
    display:block;
    font-weight:300;
    font-size:11.5px;
    color:var(--bone-dim);
    margin-top:2px;
  }

  .doc .arrow{
    font-family:'IBM Plex Mono', monospace;
    color:var(--bone-dim);
    font-size:15px;
    transition:transform 0.25s ease, color 0.25s ease;
  }

  .doc:hover .arrow{ transform:translateX(3px); color:var(--crimson-bright); }

  /* ---------- footer ---------- */
  .footer{
    margin-top:auto;
    padding-top:56px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    font-family:'IBM Plex Mono', monospace;
    font-size:9.5px;
    letter-spacing:0.1em;
    color:#4a4844;
    text-transform:uppercase;
  }

  @media (prefers-reduced-motion: reduce){
    .redact-line .bar, .redact-line span.word, .subtitle, .doc{
      animation:none !important;
      opacity:1 !important;
    }
    .redact-line .bar{ display:none; }
  }
</style>
</head>
<body>

<div class="frame">

  <div class="stamp-row">
    <span><span class="dot"></span>DIC · ATIVO</span>
    <span class="case-no" id="case-no">CASO Nº 041</span>
  </div>

  <div class="hero">
    <div class="eyebrow">Acesso restrito</div>
    <h1 style="margin:0;">
      <span class="redact-line"><span class="word">O DOSSIÊ</span><span class="bar"></span></span>
      <span class="redact-line"><span class="word" style="color:var(--bone-dim); font-weight:500;">DIVISÃO DE INTELIGÊNCIA COMPORTAMENTAL</span><span class="bar"></span></span>
    </h1>
    <p class="subtitle">Você não chegou aqui por acaso. Abaixo está o ponto de acesso liberado para este nível de autorização.</p>
  </div>

  <nav class="docs" id="docs"></nav>

  <div class="footer">
    <span>DIC © 2026</span>
    <span>Não compartilhe sem autorização</span>
  </div>

</div>

<script>
  // ---- config: edite aqui, sem mexer no resto do arquivo ----
  const CASE_NUMBER = "041";

  const LINKS = [
    {
      tag: "DOC-01",
      title: "Fale com a Divisão",
      subtitle: "Contato direto · WhatsApp",
      href: "https://wa.me/5511947299317?text=" + encodeURIComponent("Cheguei até o DOC-01. Solicito abertura de canal.")
    }
    // adicione mais objetos aqui se quiser reativar outros pontos de acesso
  ];

  document.getElementById('case-no').textContent = `CASO Nº ${CASE_NUMBER}`;

  const nav = document.getElementById('docs');
  LINKS.forEach((link, i) => {
    const a = document.createElement('a');
    a.href = link.href;
    a.className = 'doc';
    a.target = '_blank';
    a.rel = 'noopener';
    a.style.animationDelay = `${1.1 + i * 0.12}s`;
    a.innerHTML = `
      <span class="tag">${link.tag}</span>
      <span class="label">${link.title}<small>${link.subtitle}</small></span>
      <span class="arrow">→</span>
    `;
    nav.appendChild(a);
  });
</script>

</body>
</html>
